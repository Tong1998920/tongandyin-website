<main id="main">

  <!--
    HOMEPAGE CAROUSEL
    ---------------------------------------------------------------
    8 slides, numeric position is the sole ordering authority (image
    files/order/sizing are unchanged from the previous round — see
    assets/images/home/). Each slide's artwork image is now a plain
    link through to that exact artwork's Selected Works page (added
    per the homepage-linking brief, confirmed against reference
    screenshots) — but still carries no caption/text underneath, and
    the link is deliberately styled to look IDENTICAL on hover/focus
    (see .carousel-figure-link in style.css: cursor: pointer only,
    no opacity/filter/scale change) since these are light, high-key
    works where a hover effect would make them harder to see. The
    mapping below is fixed by the artist's reference screenshots, not
    by file order alone — 06/07/08 intentionally all point to the
    same Ignore 02 page:
      data-index 0 (home-01) -> works/calling-a-deer-a-horse/
      data-index 1 (home-02) -> works/the-stranger/stranger-01/
      data-index 2 (home-03) -> works/ignore/ignore-01/
      data-index 3 (home-04) -> works/the-boundary/boundary-02/
      data-index 4 (home-05) -> works/the-boundary/boundary-03/
      data-index 5 (home-06) -> works/ignore/ignore-02/
      data-index 6 (home-07) -> works/ignore/ignore-02/
      data-index 7 (home-08) -> works/ignore/ignore-02/
    Each of those destination pages already opens on the exact
    sub-work state shown in the reference TARGET screenshots by
    default, so a plain link to the page is the correct, minimal
    mechanism here — no query/hash deep-link routing was needed.

    Each image keeps its own original aspect ratio inside a shared
    viewing box (object-fit: contain in style.css) — never cropped,
    never stretched, never forced to a common width. All eight load
    eagerly (no loading="lazy") even though only the first is visible
    at first — with the carousel image-heavy but not enormous, that
    small extra weight up front is what keeps prev/next feeling
    instant instead of pausing to fetch each image the first time
    it's shown. Only the first slide additionally gets
    fetchpriority="high", since it's the one visible before any
    script runs.

    The <noscript> rule hides the prev/next arrows when JS can't run
    (they'd otherwise be dead buttons) — the first slide is still
    fully visible and still a working link without any script.
  -->
  <noscript><style>.carousel-arrow{display:none;}</style></noscript>

  <div class="carousel" data-carousel>
    <div class="carousel-stage">
      <button type="button" class="carousel-arrow carousel-arrow--prev" data-carousel-prev aria-label="Previous artwork">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg>
      </button>

      <div class="carousel-viewport">
        <ul class="carousel-track">

          <li class="carousel-slide is-active is-visible" data-index="0">
            <a class="carousel-figure carousel-figure-link" href="works/calling-a-deer-a-horse/" aria-label="Calling A Deer A Horse">
              <img src="assets/images/home/home-01-ignore.jpg" alt="Ignore, Tong Yin" width="2400" height="1917" fetchpriority="high">
            </a>
          </li>

          <li class="carousel-slide" data-index="1">
            <a class="carousel-figure carousel-figure-link" href="works/the-stranger/stranger-01/" aria-label="The Stranger">
              <img src="assets/images/home/home-02-ignore.jpg" alt="Ignore, Tong Yin" width="2400" height="1917">
            </a>
          </li>

          <li class="carousel-slide" data-index="2">
            <a class="carousel-figure carousel-figure-link" href="works/ignore/ignore-01/" aria-label="Ignore">
              <img src="assets/images/home/home-03-ignore.jpg" alt="Ignore, Tong Yin" width="2400" height="1917">
            </a>
          </li>

          <li class="carousel-slide" data-index="3">
            <a class="carousel-figure carousel-figure-link" href="works/the-boundary/boundary-02/" aria-label="The Boundary">
              <img src="assets/images/home/home-04-ignore.jpg" alt="Ignore, Tong Yin" width="2400" height="1917">
            </a>
          </li>

          <li class="carousel-slide" data-index="4">
            <a class="carousel-figure carousel-figure-link" href="works/the-boundary/boundary-03/" aria-label="The Boundary">
              <img src="assets/images/home/home-05-ignore.jpg" alt="Ignore, Tong Yin" width="2400" height="1917">
            </a>
          </li>

          <li class="carousel-slide" data-index="5">
            <a class="carousel-figure carousel-figure-link" href="works/ignore/ignore-02/" aria-label="Ignore">
              <img src="assets/images/home/home-06-ignore.jpg" alt="Ignore, Tong Yin" width="2400" height="1917">
            </a>
          </li>

          <li class="carousel-slide" data-index="6">
            <a class="carousel-figure carousel-figure-link" href="works/ignore/ignore-02/" aria-label="Ignore">
              <img src="assets/images/home/home-07-ignore.jpg" alt="Ignore, Tong Yin" width="2400" height="1917">
            </a>
          </li>

          <li class="carousel-slide" data-index="7">
            <a class="carousel-figure carousel-figure-link" href="works/ignore/ignore-02/" aria-label="Ignore">
              <img src="assets/images/home/home-08-ignore.jpg" alt="Ignore, Tong Yin" width="2400" height="1917">

          </li>

        </ul>

    </div>
  </div>

      THE BOUNDARY OVERVIEW
      ---------------------------------------------------------------
      Sits inside the same left-column / right-stage grid as the
      Calling A Deer A Horse detail template (.work-detail). Unlike
      that page, this one has NO .work-detail-info block — The
      Boundary is a group of three independent artworks, not one, so
      no single title/medium/dimensions/year belongs here. The right
      column carries no carousel either: three static, linked images
      (.boundary-overview-stage, style.css), read top to bottom as one
      exhibition sequence rather than a grid: Boundary 02 and 03 (the
      two physically smaller works) first, centered; Boundary 01 (by
      far the largest) below that at the same displayed scale it's
      always had — natural document flow, not squeezed to fit one
      screen, so it sits mostly below the fold and the page scrolls to
      reach it. No metadata, no captions, no hover text — images only.
    -->

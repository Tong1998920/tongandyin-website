    <!--
      THE BOUNDARY 01 — DETAIL
      ---------------------------------------------------------------
      Direct structural clone of the Calling A Deer A Horse detail
      template. Physically the largest of the three Boundary works
      (195 × 175 cm), so its image is not scaled down to match
      Boundary 02 / 03 the way the overview page does — see
      .work-carousel-slide's own fixed stage box, which every
      work-detail page shares regardless of the physical artwork's
      size. Same image-hover left/right navigation as Calling A Deer
      A Horse; [data-work-carousel] in main.js is page-scoped, so it
      applies here unmodified. No photography credit, per the brief.
    -->
    <div class="work-detail">
      <aside class="work-detail-side">
        <div>
          <h1 class="selected-works-heading">Selected Works</h1>
          <nav class="selected-works-list" aria-label="Selected works">

        <div class="work-detail-info">

          <p class="work-detail-meta">Chinese silk and acrylic</p>
          <p class="work-detail-meta">195 × 175 cm</p>
          <p class="work-detail-meta">2025</p>
        </div>
      </aside>

      <div class="work-detail-stage">

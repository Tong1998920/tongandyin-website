    <!--
      IGNORE 02 — DETAIL
      ---------------------------------------------------------------
      Direct structural clone of the Calling A Deer A Horse detail
      template (.work-detail). A three-panel work: each canvas
      photographed individually, in left-to-right panel order. The
      overview composite (ignore-02-overview.jpg) is deliberately NOT
      included here — it is a navigation-only image on the Ignore
      overview page. Same image-hover left/right navigation as Calling
      A Deer A Horse; [data-work-carousel] in main.js is page-scoped,
      so it applies here unmodified.

      Photography by Bonsai Peng — same credit as Calling A Deer A
      Horse, in the same .work-detail-credit position/styling.
    -->
    <div class="work-detail">
      <aside class="work-detail-side">
        <div>
          <h1 class="selected-works-heading">Selected Works</h1>
          <nav class="selected-works-list" aria-label="Selected works">
            <a href="../../calling-a-deer-a-horse/">Calling A Deer A Horse</a>
            <a href="../../ignore/" aria-current="page">Ignore</a>
            <a href="../../the-boundary/">The Boundary</a>
            <a href="../../the-stranger/">The Stranger</a>
          </nav>
        </div>

        <div class="work-detail-info">
          <p class="work-detail-title">Ignore</p>
          <p class="work-detail-meta">Acrylic on Chinese silk,<br>acrylic on canvas board,<br>gold ink</p>
          <p class="work-detail-meta">33 × 27 cm</p>
          <p class="work-detail-meta">2026</p>
          <p class="work-detail-credit">Photography by Bonsai Peng</p>
        </div>
      </aside>

      <div class="work-detail-stage">
        <div class="work-carousel" data-work-carousel>
          <ul class="work-carousel-track">
            <li class="work-carousel-slide is-active is-visible" data-index="0">
              <img src="../../../assets/images/works/ignore-02-panel-1.jpg" alt="Ignore, Tong Yin — panel one" width="2400" height="1917">
            </li>
            <li class="work-carousel-slide" data-index="1">
              <img src="../../../assets/images/works/ignore-02-panel-2.jpg" alt="Ignore, Tong Yin — panel two" width="2400" height="1917">
            </li>
            <li class="work-carousel-slide" data-index="2">
              <img src="../../../assets/images/works/ignore-02-panel-3.jpg" alt="Ignore, Tong Yin — panel three" width="2400" height="1917">
            </li>
          </ul>
        </div>
      </div>
    </div>

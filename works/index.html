    <!--
      WORKS SEQUENCE
      ---------------------------------------------------------------
      This is a calm, centered sequence, not a grid, and not a visible
      left/right/center pattern. Each entry below is one
      <div class="work-item work-item--SIZE"> block. The SIZE modifier
      (see style.css) controls how large that one work reads:

        lead      — the largest, used once as the sequence's anchor
        standard  — the normal size for most entries
        intimate  — the smallest, for a quieter, more private work

      Two of those have off-center variants, standard-left and
      standard-right, which nudge the entry only slightly (about 40px)
      off center. Use at most one or two of these in the whole page —
      they exist so the sequence doesn't feel mechanically centered,
      not to create a rule the visitor can spot. Everything else stays
      centered. Do not alternate left/right/left/right.

      To add a work:
        1. Duplicate a whole block below (from
           <div class="work-item ..."> to its closing </div>).
        2. Create a folder under /works/ for it (copy an existing one,
           e.g. works/the-boundary, and rename it), point the href at
           it, and update its own page.
        3. Default to a centered size (lead / standard / intimate).
           Only reach for standard-left or standard-right if the page
           doesn't already have one of those in use nearby.
    -->
    <div class="works-sequence">

      <div class="work-item work-item--lead">
        <a class="work-item-link" href="calling-a-deer-a-horse/">
          <figure class="work-item-figure">

                 alt="Calling A Deer A Horse, Tong Yin — installation view"
                 width="1900" height="1306" loading="lazy">
          </figure>
          <figcaption class="work-item-caption caption">
            <span class="index-row-title">Calling A Deer A Horse</span>
            <span>2026</span>
          </figcaption>
        </a>
      </div>

      <div class="work-item work-item--standard">

            <img src="../assets/images/works/ignore-01.jpg"

          </figure>
          <figcaption class="work-item-caption caption">
            <span class="index-row-title">Ignore</span>
            <span>[Add year]</span>
          </figcaption>
        </a>
      </div>

      <div class="work-item work-item--standard-left">

      </div>

      <div class="work-item work-item--standard-right">

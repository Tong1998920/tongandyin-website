      THE STRANGER 01 — PREVIEW
      ---------------------------------------------------------------
      Dedicated "image only" viewing template for the Stranger series
      (see style.css, .stranger-preview-stage) — deliberately separate
      from the metadata-carrying .work-detail-info / boxed
      .work-carousel every other work-detail page (Calling A Deer A

      CSS is touched by this page. No title, medium, dimensions, year,
      or credit is shown — that information is kept as data-* on
      .stranger-preview-stage below for future use, not rendered.

      Switching between Stranger 01–04 has no visible prev/next
      control: clicking the image's own left/right half (quiet
      arrow-cursor hint, same convention as .work-carousel elsewhere
      on the site) or the Left/Right arrow keys moves between works —
      see main.js, [data-stranger-preview]. The visually-hidden link
      below keeps the series reachable without JavaScript and for
      keyboard/screen-reader users. First artwork in the series: no
      "previous" target.
    -->

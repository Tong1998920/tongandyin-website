    <!--
      THE STRANGER OVERVIEW
      ---------------------------------------------------------------
      Sits inside the same left-column / right-stage grid as the
      Calling A Deer A Horse detail template (.work-detail). Like
      Ignore and The Boundary, this one has NO .work-detail-info block
      — The Stranger is a group of four independent artworks, not one,
      so no single title/medium/dimensions/year belongs here. Unlike
      either of those two (one vertical stack, one single row), the
      right column here is a deliberately asymmetrical, non-grid
      composition (.stranger-overview-stage, style.css): Stranger 01
      small, alone, upper-middle; 02 and 03 as a staggered medium pair
      below it; Stranger 04 large, anchoring the whole composition at
      the foot. Four static, linked images, each a plain link to its
      own artwork's detail page. No captions, no hover text — images
      only, by design, same as Ignore/Boundary.
    -->
    <div class="work-detail">

          </nav>
        </div>
      </aside>

              <img src="../../assets/images/works/stranger-01-full.jpg" alt="The Stranger, Tong Yin — Stranger 01" width="2400" height="1917">

        </div>

    <!--
      THE STRANGER OVERVIEW
      ---------------------------------------------------------------
      Sits inside the same left-column / right-stage grid as every
      other work-detail page (.work-detail). Like Ignore and The
      Boundary, this one has NO .work-detail-info block — The
      Stranger is a group of four independent artworks, not one. Reads
      top to bottom as a three-tier exhibition sequence rather than a
      grid or a single row (.stranger-overview-*, style.css): Stranger
      01 alone near the top, smaller; Stranger 04 and Stranger 02
      paired side by side below that, medium-large and balanced;
      Stranger 03 alone lower still, the largest of the four. Order
      here is deliberate composition, not the series' 01→02→03→04
      navigation order — each figure still links straight to its own
      artwork's correct detail page regardless of where it sits on
      this page. No captions, no hover text — images only, by design,
      same as Ignore/Boundary.
    -->

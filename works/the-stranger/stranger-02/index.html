      THE STRANGER 02 — DETAIL
      ---------------------------------------------------------------
      Direct structural clone of the Calling A Deer A Horse detail
      template. One of four independent artworks in The Stranger
      series (01–04). Physically mid-sized, so its stage box uses the
      .work-detail-stage--medium modifier (style.css) rather than the
      shared fixed-size box every other work-detail page keeps. Single
      photograph, so [data-work-carousel] in main.js (page-scoped,
      unmodified) is a no-op here — fewer than two slides means no
      hover/click navigation zones are attached.

      No photography credit shown — only Stranger 01 carries one; see
      that page's own comment.
    -->
    <div class="work-detail">

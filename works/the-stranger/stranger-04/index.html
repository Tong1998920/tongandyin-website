      THE STRANGER 04 — DETAIL
      ---------------------------------------------------------------
      Direct structural clone of the Calling A Deer A Horse detail
      template. Last of the four artworks in The Stranger series
      (01–04). Its own title is "The Stranger 3", NOT "The Stranger"
      — deliberate, given verbatim in the brief, and kept exactly as
      specified rather than normalized to match the other three.
      Physically the largest of the four, so its stage box uses the
      .work-detail-stage--large modifier (style.css) — wider even than
      the shared default box every other work-detail page keeps, to
      read as the composition's anchor. Single photograph, so
      [data-work-carousel] in main.js (page-scoped, unmodified) is a
      no-op here — fewer than two slides means no hover/click
      navigation zones are attached.

      No photography credit shown — only Stranger 01 carries one; see
      that page's own comment. Last artwork in the series, so its
      "next" link closes the loop back to The Stranger overview,
      mirroring Stranger 01's "previous" link at the other end.
    -->

    <!--
      ARCHIVE
      ---------------------------------------------------------------
      A second, separate browsing system from Works/Selected Works —
      earlier works, shown as a flat thumbnail grid under two plain
      text category tabs (2022-2026 / before-2022) rather than each
      getting its own project page. Clicking a thumbnail opens a
      full-screen lightbox (markup below, right after </main>) instead
      of navigating anywhere; previous/next inside the lightbox moves
      between works in the currently active category. All of this —
      the grid, the tabs, the lightbox — is rendered by
      assets/js/main.js's [data-archive] block, entirely from the
      ARCHIVE_WORKS array declared in the <script> further down this
      file. See style.css's "archive" section for the layout rules.

      TO ADD A WORK LATER: add one object to the ARCHIVE_WORKS array
      below (image, thumbnail, title, year, medium, dimensions,
      category, and optionally width/height) — nothing on this page
      or in style.css needs to change. "2022-2026" was intentionally
      emptied back to zero works (see the long comment further down,
      right above ARCHIVE_WORKS, for why) and is due a full new set
      from the artist; until then its tab falls back to the same
      placeholder note "before-2022" used to show when it had nothing
      either. Still true either way: do not add placeholder or stock
      images to fill a category with none.
    -->
    <h1 class="eyebrow" style="margin-bottom: var(--space-3);">Archive</h1>

    <nav class="archive-categories" aria-label="Archive categories">
      <button type="button" class="archive-category-btn is-active" data-archive-category="2022-2026" aria-pressed="true">2022–2026</button>
      <button type="button" class="archive-category-btn" data-archive-category="before-2022" aria-pressed="false">Before 2022</button>
    </nav>

    <!-- data-archive-grid is now a wrapper, not the grid itself: JS
         (renderGrid() in main.js) fills it with one or more child
         .archive-grid elements, one per `group` present in the active
         category's works (see the ARCHIVE_WORKS comment below for
         what `group` means and how to add more). A category with no
         `group` field on its works (e.g. "before-2022" today) still
         renders as a single .archive-grid child, identical to before
         this existed. No visible heading/label is ever added for a
         group — the only thing that marks a group boundary is the
         larger gap in style.css's ".archive-grid + .archive-grid"
         rule, which only applies between two sibling grids, so a
         single-group category gets no extra gap at all. -->
    <div class="archive-groups" data-archive-grid></div>

    <p class="placeholder-note" data-archive-empty>Archive works have not been added yet.</p>

  </section>
</main>

<!-- Archive lightbox: one overlay, shared by every work in the grid
     above (see main.js, [data-archive-lightbox]). Starts hidden; JS
     shows it and fills in the image/caption when a thumbnail (or a
     #work-<id> deep link) opens it. -->
<div class="archive-lightbox" data-archive-lightbox hidden>
  <button type="button" class="archive-lightbox-close" data-archive-lightbox-close>Close</button>
  <figure class="archive-lightbox-figure">
    <img class="archive-lightbox-image" data-archive-lightbox-image alt="">
    <!-- No src attribute here on purpose: an empty src="" resolves to
         the current page URL and the browser will actually request it,
         which briefly registers as a "broken image" on every page
         load. JS sets a real src the first time a work is shown. -->
    <figcaption class="archive-lightbox-meta" data-archive-lightbox-meta></figcaption>
    <!-- Optional quiet "Video →" links for works that have one (see
         the `videos` field on a few ARCHIVE_WORKS entries below, e.g.
         "Don't bother me" / "Fire") — populated by JS alongside the
         caption above; empty and not rendered for every other work. -->
    <p class="archive-lightbox-videos" data-archive-lightbox-videos hidden></p>
  </figure>
</div>

                    or a lighter version of it — never a cropped one)
        title:      artwork title
        year:       artwork year
        medium:     medium description
        dimensions: display dimensions
        category:   '2022-2026' or 'before-2022' — which Archive tab
                    the work appears under

                    but the mechanism is unchanged and still there for
                    whatever's added next
        width,
        height:     optional, the image's intrinsic pixel size (avoids
                    layout shift while it loads, same as every other
                    image on the site)
        group:      optional number — works sharing the same `group`
                    (within the same category) are laid out together
                    as one 3-column grid, with a visibly larger gap
                    before the next group's grid (see style.css,
                    ".archive-grid + .archive-grid") — no heading or
                    label is ever rendered for a group, purely a
                    whitespace break. Groups render in the order their
                    first work appears in this array; works within a
                    group render in their own order in this array — so
                    a group's works should stay contiguous here. Omit
                    `group` entirely for a category that isn't
                    (or isn't yet) organized into groups — see
                    "before-2022" below, which has none and renders as
                    one plain grid, exactly as it always has.
      }

    new collection and its exact order from scratch. This was a data-
    only change: nothing was added, reordered, or guessed to fill the
    gap, and no physical image file was deleted — every archive-01
    through archive-40 .jpg/.jpg-thumb pair and every archive-55

    before that category had any works of its own (see below). Adding
    the new collection later is exactly the "TO ADD A WORK LATER" case
    described above this comment block — new objects appended to this
    array — nothing here or in style.css needs to change for that.

    future group could opt into the same large gap by adding its

    un-flagged later by removing '2022-2026:1' from it, without

    no box, border, caption, or clickable element, purely CSS margin.

    embedded metadata at all, so they're kept with no title/year/
    medium/dimensions rather than guessed ones. This append order is
    still temporary, same as it was before this reset.

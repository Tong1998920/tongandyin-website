    <!--
      ARCHIVE
      ---------------------------------------------------------------
      A second, separate browsing system from Works/Selected Works —
      earlier works, shown as a flat thumbnail grid under two plain
      text category tabs (2022-2026 / before-2022) rather than each
      getting its own project page. Clicking a thumbnail opens a
      full-screen lightbox (markup below, right after </main>) instead
      of navigating anywhere; previous/next inside the lightbox moves
      between works in the currently active category. All of this —
      the grid, the tabs, the lightbox — is rendered by
      assets/js/main.js's [data-archive] block, entirely from the
      ARCHIVE_WORKS array declared in the <script> further down this
      file. See style.css's "archive" section for the layout rules.

      TO ADD A WORK LATER: add one object to the ARCHIVE_WORKS array
      below (image, thumbnail, title, year, medium, dimensions,
      category, and optionally width/height) — nothing on this page
      or in style.css needs to change. "2022-2026" was intentionally
      emptied back to zero works (see the long comment further down,
      right above ARCHIVE_WORKS, for why) and is due a full new set
      from the artist; until then its tab falls back to the same
      placeholder note "before-2022" used to show when it had nothing
      either. Still true either way: do not add placeholder or stock
      images to fill a category with none.
    -->
    <h1 class="eyebrow" style="margin-bottom: var(--space-3);">Archive</h1>

    <nav class="archive-categories" aria-label="Archive categories">
      <button type="button" class="archive-category-btn is-active" data-archive-category="2022-2026" aria-pressed="true">2022–2026</button>
      <button type="button" class="archive-category-btn" data-archive-category="before-2022" aria-pressed="false">Before 2022</button>
    </nav>

    <!-- data-archive-grid is now a wrapper, not the grid itself: JS
         (renderGrid() in main.js) fills it with one or more child
         .archive-grid elements, one per `group` present in the active
         category's works (see the ARCHIVE_WORKS comment below for
         what `group` means and how to add more). A category with no
         `group` field on its works (e.g. "before-2022" today) still
         renders as a single .archive-grid child, identical to before
         this existed. No visible heading/label is ever added for a
         group — the only thing that marks a group boundary is the
         larger gap in style.css's ".archive-grid + .archive-grid"
         rule, which only applies between two sibling grids, so a
         single-group category gets no extra gap at all. -->
    <div class="archive-groups" data-archive-grid></div>

    <p class="placeholder-note" data-archive-empty>Archive works have not been added yet.</p>

  </section>
</main>

<!-- Archive lightbox: one overlay, shared by every work in the grid
     above (see main.js, [data-archive-lightbox]). Starts hidden; JS
     shows it and fills in the image/caption when a thumbnail (or a
     #work-<id> deep link) opens it. -->
<div class="archive-lightbox" data-archive-lightbox hidden>
  <button type="button" class="archive-lightbox-close" data-archive-lightbox-close>Close</button>
  <figure class="archive-lightbox-figure">
    <img class="archive-lightbox-image" data-archive-lightbox-image alt="">
    <!-- No src attribute here on purpose: an empty src="" resolves to
         the current page URL and the browser will actually request it,
         which briefly registers as a "broken image" on every page
         load. JS sets a real src the first time a work is shown. -->
    <figcaption class="archive-lightbox-meta" data-archive-lightbox-meta></figcaption>
    <!-- Optional quiet "Video →" links for works that have one (see
         the `videos` field on a few ARCHIVE_WORKS entries below, e.g.
         "Don't bother me" / "Fire") — populated by JS alongside the
         caption above; empty and not rendered for every other work. -->
    <p class="archive-lightbox-videos" data-archive-lightbox-videos hidden></p>
  </figure>
</div>

<script>
  /*
    ARCHIVE DATA
    ---------------------------------------------------------------
    The only place Archive content lives. Each entry:

      {
        id:         unique string — becomes the shareable lightbox URL
                    ("#work-<id>"), so keep it stable once published
        image:      full-size artwork image, shown in the lightbox
        thumbnail:  grid thumbnail (can be the same file as `image`,
                    or a lighter version of it — never a cropped one)
        title:      artwork title
        year:       artwork year
        medium:     medium description
        dimensions: display dimensions
        category:   '2022-2026' or 'before-2022' — which Archive tab
                    the work appears under
        videos:     optional array of { label, url } — renders as quiet
                    "Video →" links under the caption (see main.js
                    showWork() and .archive-lightbox-videos in
                    style.css); the two entries that used to have this
                    ("Don't bother me", "Fire") were removed in the
                    2022-2026 reset below, so no current entry uses it,
                    but the mechanism is unchanged and still there for
                    whatever's added next
        width,
        height:     optional, the image's intrinsic pixel size (avoids
                    layout shift while it loads, same as every other
                    image on the site)
        group:      optional number — works sharing the same `group`
                    (within the same category) are laid out together
                    as one grid (3 columns by default), with a gap
                    before the next group's grid (see style.css,
                    ".archive-grid + .archive-grid") — no heading or
                    label is ever rendered for a group, purely a
                    whitespace break. Groups render in the order their
                    first work appears in this array; works within a
                    group render in their own order in this array — so
                    a group's works should stay contiguous here. Omit
                    `group` entirely for a category that isn't
                    (or isn't yet) organized into groups — see
                    "before-2022" below, which has none and renders as
                    one plain grid, exactly as it always has. Every
                    group gets the exact same section-to-section gap
                    (style.css's ".archive-grid + .archive-grid", a
                    single fixed value — see the note further down for
                    why per-group gap overrides were removed). A
                    group's column layout can still be individually
                    overridden — see window.ARCHIVE_GROUP_LAYOUT (a
                    different column layout for a specific group, e.g.
                    group 4's compact 2-column block) just above
                    ARCHIVE_WORKS below.
      }

    "2022-2026" RESET: this category previously held four batches
    (43 works: archive-01 through archive-40, plus three surviving
    GIFs from a fourth batch, archive-56/58/60 — two more from that
    same fourth batch, archive-55 and archive-59, had already been
    removed the same way in an earlier edit). All of it — every
    2022-2026 entry — was deliberately removed from this array at the
    artist's explicit request, as a full reset before they supply a
    new collection and its exact order from scratch. This was a data-
    only change: nothing was added, reordered, or guessed to fill the
    gap, and no physical image file was deleted — every archive-01
    through archive-40 .jpg/.jpg-thumb pair and every archive-55
    through archive-60 .gif still sits in assets/images/archive/
    exactly as before, simply unreferenced by any entry now (several
    of the .jpg thumbnails were also candidates for reuse, but per
    instruction none were reused or re-added on a guess). The category
    tab itself, its "2022–2026" label, and the empty-state placeholder
    note ("Archive works have not been added yet.") are unchanged and
    untouched — with zero entries in this category, that placeholder
    now simply shows here the same way it already did for "before-2022"
    before that category had any works of its own (see below). Adding
    the new collection later is exactly the "TO ADD A WORK LATER" case
    described above this comment block — new objects appended to this
    array — nothing here or in style.css needs to change for that.

    "2022-2026" REBUILD, group 1 (archive-61 through archive-68, 8
    works — originally 11, archive-61 through archive-71; archive-69
    "Baby girl", archive-70 "Dream" and archive-71 "Spider-Maid's
    private time", the three sculpture-photo works that had closed out
    the group, were removed shortly after at the artist's request —
    see the large-gap note further below) and group 2 (archive-72
    through archive-79, 8 works): the first two groups of the new,
    from-scratch "2022-2026" collection, each in the exact order the
    artist specified (by numbered filename, 1 through 11 and 1 through
    8 — NOT alphabetical, date, dimension, or composition order).
    archive-69/70/71's image files were left in assets/images/archive/
    (archive-69-full.jpg, archive-69-thumb.jpg, and the same pair for
    70/71) rather than deleted, same as every other removal on this
    page — simply unreferenced now. Sourced from two freshly
    uploaded ZIPs, not from any pre-reset archive-01..40/55..60 file
    above, per instruction — new image files, new ids, even where a
    work's title/medium/dimensions happens to match one from before
    the reset (several clearly do; that's the same real artwork being
    reintroduced deliberately, not a coincidence, but it's still a new
    entry with its own fresh asset files rather than a pointer back to
    the old ones). group 1's images (jpg/png) were resized the same
    way as every prior batch on this page — long edge capped at 2200px
    for the lightbox `image`, 900px for the grid `thumbnail`, aspect
    ratio untouched, re-encoded as JPEG (the two PNG source files were
    fully opaque, so flattening to JPEG changes nothing visible) —
    never cropped or stretched. group 2's six .gif files are copied
    through unchanged (same convention as the pre-reset GIF batch:
    `image` and `thumbnail` point at the identical original .gif, no
    resize, no first-frame extraction, no separate thumbnail file) —
    two of these six are actually byte-identical to the removed
    archive-55/57/59/56/58/60 files from before the reset (same
    animations, re-supplied fresh per instruction rather than re-
    linked to the old paths); its remaining two works are static jpg
    photos, resized the same way as group 1.

    Titles/medium here are taken verbatim from THIS batch's own
    filenames, not copied from the pre-reset entries even when the
    same work was documented differently there — e.g. this batch
    spells the group-2 GIF titles "Please step on my face" and "Go to
    heaven" (sentence case) and "Don't Bother Me" (title case),
    inconsistent with each other and with the title-case versions the
    pre-reset GIF batch used ("Please Step on My Face", "Go to
    Heaven") — left exactly as this batch's filenames give them,
    same don't-alter-given-titles rule as everywhere else in this
    file. archive-64 ("Relayed Flame") repeats a title used by an
    earlier, different work in this same file (the pre-reset "Relayed
    Flame 10"/"Relayed Flame 70") with different dimensions/medium —
    kept as a distinct work, per the same repeated-title handling used
    throughout this file. archive-64's dimensions ("45-70 × 120 cm")
    are worth the artist double-checking against their own records.
    (The former archive-69 "Baby girl" repeated the archive-61 "Baby
    Girl" title the same way, and was the one group-1 filename with no
    leading number, positioned as #9 per the artist's reference
    screenshot rather than its filename — both now moot, since
    archive-69 was removed; see the large-gap note below.)
    "2022-2026" REBUILD, group 3 (archive-80 through archive-89, 10
    works): the third group of the collection, laid out as a 4-row,
    3-column block per the artist's reference screenshot (10 works in
    a 3-column grid naturally leaves the last row with a single item
    in the left column and nothing else — no special-case CSS needed,
    that's just how CSS Grid auto-placement fills a 3-column track).
    Sourced from three freshly uploaded ZIPs (10 files total, one work
    each — matched to the artist's numbered reference screenshot by
    filename, and each one visually opened and compared against the
    screenshot's thumbnail before being added, the same verification
    practice used for every prior identify-by-filename batch on this
    page); array order here is the row-by-row, left-to-right reading
    order from that screenshot (80/81/82 = row 1, 83/84/85 = row 2,
    86/87/88 = row 3, 89 = row 4 alone), which is also exactly the DOM
    order the 3-column grid needs to reproduce that layout. Resized the
    same way as every prior jpg/png batch on this page — long edge
    capped at 2200px for `image`, 900px for `thumbnail`, aspect ratio
    untouched, re-encoded as JPEG (the three PNG sources were fully
    opaque, so flattening to JPEG changes nothing visible) — never
    cropped, stretched, or upscaled (archive-81, whose source was
    already under the 2200px cap, was left at its original size rather
    than enlarged). Several works in this group carry incomplete
    metadata and were left that way rather than guessed, same rule as
    archive-41/42 above: archive-84 ("3. Plastic Apple") has a title
    but no year/medium/dimensions in its filename, unlike its two
    same-titled siblings archive-83/85 which do; archive-86, -87, -88
    and -89 are auto-named camera/phone files (IMG_####, a bare "18",
    a 照片_YYYY-MM-DD_###### timestamp) with no artwork title, year,
    medium, or dimensions embedded at all, so none of those fields are
    guessed from the file's date-like numbers. archive-81 and -82 share
    the title "The entitlement to become a person" for two visually
    distinct photographs — same repeated-title handling used throughout
    this file (see archive-64/68's note above); archive-83/84/85 share
    "Plastic Apple" the same way. Section 3 sits below group 2 with the
    same single section-to-section gap used everywhere else on this
    page (".archive-grid + .archive-grid" in style.css) — every group
    boundary on this page gets identical spacing, no exceptions.

    "2022-2026" REBUILD, group 4 (archive-90 through archive-93, 4
    works): a small, deliberately compact 2x2 block — Tears above Love,
    Persona above "How can you do this to me" — rather than the page's
    usual 3-column flow. Sourced from one uploaded ZIP (4 files, one
    work each, matched to the artist's reference screenshot by
    filename and confirmed by opening and visually comparing each one
    against that screenshot before adding it, same practice as every
    other identify-by-filename batch here). Resized the same way as
    every other jpg/png batch on this page — long edge capped at
    2200px for `image`, 900px for `thumbnail`, aspect ratio untouched,
    re-encoded as JPEG (all three PNG sources were fully opaque, so
    flattening to JPEG changes nothing visible) — never cropped,
    stretched, or upscaled. "Persona"'s medium is given here as
    "Digital Art"; its source filename actually spells it "Digtal Art"
    (a typo), corrected on the assumption it means "Digital", worth the
    artist double-checking. "Love" and "How can you do this to me" had
    no dimensions in their filenames, so that field is left out rather
    than guessed, same rule used throughout this file. "How can you do
    this to me" is this batch's own English rendering of a filename
    that led with the Chinese title 你怎么可以这样对我 immediately
    followed by that same English phrase with no separator — the
    English is used as the work's `title` (consistent with every other
    Archive entry using an English title) and the Chinese is preserved
    for the 中文 toggle via a new ARCHIVE_TITLES entry in main.js,
    exactly the same "genuinely Chinese-titled work" handling already
    used there for "Home"/家, "Press Release"/新闻稿, etc.

    Group 4's compact 2x2 layout, instead of the page's normal 3-column
    grid, is a general per-group mechanism: window.ARCHIVE_GROUP_LAYOUT
    (declared right before ARCHIVE_WORKS below) maps a
    '<category>:<group>' key to a style.css modifier suffix; main.js's
    renderGrid() adds an "archive-grid--<suffix>" class to that group's
    rendered <div class="archive-grid">. Group 4 maps to 'cols-2' — see
    ".archive-grid--cols-2" in style.css: exactly two columns, width
    capped to what two of the normal three columns would measure, so
    Tears/Persona/Love/"How can you do this to me" render at the same
    size as every other Archive thumbnail, just arranged as a small
    self-contained block instead of spanning the full row. This is
    independent of section spacing — group 4 gets the exact same
    section-to-section gap as every other group, just with a different
    column count inside its own grid.

    "2022-2026" REBUILD, group 5 (archive-94 through archive-102, 9
    works): back to the page's normal 3-column layout (no
    ARCHIVE_GROUP_LAYOUT entry, so it renders with the default 3-column
    grid) — a straightforward 3x3 block, laid out in the artist's exact
    reference-screenshot
    reading order (row by row, left to right), which is also the DOM
    order the grid needs. Sourced from two uploaded ZIPs (9 files, one
    work each, each opened and visually compared against the reference
    screenshot before being placed — same verification practice as
    every prior identify-by-filename batch here). Resized the same way
    as every other jpg/png batch on this page — long edge capped at
    2200px for `image`, 900px for `thumbnail`, aspect ratio untouched,
    re-encoded as JPEG, never cropped, stretched, or upscaled.

    Every titled work in this group is, by title and medium, the exact
    same real artwork as an entry already in the pre-reset "2022-2026"
    collection this file's comments describe further up (archive-64
    "Relayed Flame" being the first instance of this pattern): "Red for
    Family, Green for Ancestral Mountain", "The Stranger" (×2, distinct
    works, same title — same repeated-title handling used throughout
    this file), "Drift", "Dirty Knight" (×2), "Relayed Flame 10" and
    "Relayed Flame 70" all match titles already sitting in main.js's
    ARCHIVE_TITLES dictionary from before this page's 2022-2026 reset —
    that dictionary was never touched by the reset (it lives in
    main.js, the reset only ever removed entries from the ARCHIVE_WORKS
    array in this file), so every one of those titles already had a
    correct Chinese pairing waiting for it; only "The Stranger" needed
    a new ARCHIVE_TITLES entry added (it was already in the site-wide,
    Selected-Works-facing TITLES dictionary, but that one isn't
    consulted by the Archive page's zhTitle(), so it had to be added to
    ARCHIVE_TITLES separately). Every work's medium here — "亚克力板上
    丙烯、中国绢" — matches the ARCHIVE_MEDIUM_EXTRA translation pair
    already in main.js too, so it's rendered as "Acrylic on acrylic
    board, Chinese silk" with no new translation work needed. None of
    this group's filenames include a year, so `year` is left out of
    every entry here rather than guessed. archive-98 ("场景 2.JPG",
    "Scene 2") is a documentation/installation photo, not an
    individually titled artwork — its filename carries no title,
    medium, or dimensions, so (like archive-41/42, -86 through -89
    above) none of those fields are guessed for it; its visible content
    (two other archive works under gallery lighting) is exactly what
    its position in the reference screenshot's row 2 shows.

    SECTION REORDER: group 5 (the 3x3 block described just above) was
    moved from the last section on the page to the first, at the
    artist's request — the page now reads group 5, then groups 1-4 in
    their original relative order (previously it was groups 1-4, then
    5). This was done by physically moving group 5's nine object
    literals earlier in this array, to right after the last
    "before-2022" entry and right before group 1's first entry —
    nothing else changed: same nine works, same internal 3x3 order,
    same `group: 5` number on each (deliberately left as "5" rather
    than renumbered to "0" or "1", since renderGrid() orders groups by
    where each one's first work appears in this array, not by the
    numeric value of `group` — that number is only ever used as an
    opaque lookup key for ARCHIVE_GROUP_LAYOUT, so leaving it as 5
    costs nothing and avoids touching five other groups' worth of
    entries and every reference to "group 1"/"group 4" elsewhere in
    these comments and in main.js). Because ARCHIVE_GROUP_LAYOUT
    ({'2022-2026:4': 'cols-2'}) keys off that same group number rather
    than position, moving group 5 didn't require touching it at all:
    group 4 still renders as the compact 2-column block, completely
    unaffected by group 5 now sitting in front of it. Every group
    boundary, including the two newly-adjacent ones this move created,
    gets the same single section gap (see the gap-unification note
    below), so no gap-specific bookkeeping was needed either. Group 4
    (the compact 2x2 block) is now the last section on the page, so
    there is no leftover gap at group 5's old location — the page
    simply ends after group 4, same as it would have regardless of
    which group happened to render last.

    IMAGE REPLACEMENT, group 5 (now "Section 1"): all nine of group 5's
    images (archive-94 through archive-102) were replaced with newer
    versions the artist supplied — same nine real artworks, same ids,
    same titles/medium/dimensions/order, only the underlying jpg files
    (and, where the new photo was framed differently, the `width`/
    `height` fields) changed. Matched to their existing entries by
    filename (all nine replacement files use the exact same filenames
    as the batch that originally created this group) and confirmed by
    opening and visually comparing each one against its current entry
    before replacing anything — several are tighter or differently
    cropped documentation shots of the same piece (most visibly
    archive-95 and archive-99, both "The Stranger," which went from a
    wider landscape crop to a tighter near-square one), which is why
    their `width`/`height` needed updating even though nothing else
    about the entry did. Resized the same way as every other jpg/png
    batch on this page — long edge capped at 2200px for `image`, 900px
    for `thumbnail`, aspect ratio of the NEW source untouched, re-
    encoded as JPEG. The old versions of these nine files were simply
    overwritten in place at the same archive-94..102-full/thumb.jpg
    paths (same convention as every prior "replace," e.g. round 24's
    sculpture removal, of leaving no orphaned old file — here there's
    no old file to orphan, since the filename never changes on a
    same-slot replacement, only its contents do). No entries were
    added, removed, or reordered.

    GAP UNIFICATION (history): at two earlier points this page grew a
    per-group "bigger gap" override — first when archive-69/70/71 (three
    sculpture photos) were removed from the end of group 1 and the
    artist wanted that lost vertical space preserved as an intentionally
    large blank gap before group 2 (~650px, an "ARCHIVE_LARGE_GAP_AFTER"
    /".archive-grid--gap-large" opt-in on '2022-2026:1'); then again when
    group 5 was moved to the front (see "SECTION REORDER" above) and the
    artist wanted a visibly larger separation specifically between it and
    the group that then followed it (~300-350px, a second, independent
    "ARCHIVE_XL_GAP_AFTER"/".archive-grid--gap-xl" opt-in on
    '2022-2026:5'). With both of those in place at once, the page's
    section gaps ended up visually inconsistent — some boundaries at the
    normal spacing, one around 650px, one around 300-350px — which the
    artist then asked to fix: one balanced, consistent gap between every
    section instead. Both opt-in mechanisms (their window.* arrays here,
    the classList-adding code in main.js's renderGrid(), and the
    ".archive-grid--gap-large"/".archive-grid--gap-xl" rules in
    style.css) were removed rather than left dormant, and every group
    boundary on this page — including the group-1→group-2 and
    group-5→group-1 boundaries that used to be special-cased — now gets
    the exact same single gap, set once via style.css's
    "--archive-section-gap" custom property (currently 160px) and
    applied by ".archive-grid + .archive-grid". See that rule in
    style.css for the full current explanation; nothing group-specific
    remains to describe here.

    Section 6 onward, and any further reordering, are left for a
    future update — nothing about this structure needs to change to
    append another group or move an existing one again (see the
    `group` field description above).

    before-2022 (archive-41 through archive-54, 14 works) is NOT part
    of this reset and is completely unchanged — added as the third of
    the four batches mentioned above, from two uploaded ZIPs, mixing
    English-titled filenames used verbatim ("On The Street" ×2 with
    different media — Ink pen/paper vs. pencil — kept as two distinct
    works, not a duplicate; "Persona", "Rocket Man", "Toy" — a second,
    distinct "Toy" from a same-titled 2022-2026 work this reset has
    since removed; "Bum!", "Dance", "Princess") with four Chinese
    filenames whose titles are best-effort English translations
    flagged for the artist's confirmation: 家 → "Home", 新闻稿 → "Press
    Release", 未命名作品16 → "Untitled 16", 逃离房间 → "Escape Room"; 印刷
    后铅笔、纸 → "Pencil on print, paper", 印刷、水彩、纸 → "Print,
    watercolor, paper", 数字艺术 → "Digital art", 综合材料 → "Mixed
    media", 游戏 → "Game". archive-51's dimensions field preserves the
    filename's own "A4 size" rather than converting it to a guessed cm
    figure. archive-41/42 (IMG_6246.JPG, IMG_6254.JPG) carried no
    embedded metadata at all, so they're kept with no title/year/
    medium/dimensions rather than guessed ones. This append order is
    still temporary, same as it was before this reset.
  */
  // See the "GAP UNIFICATION (history)" note above: this page used to
  // carry two per-group "bigger gap" opt-in arrays here
  // (ARCHIVE_LARGE_GAP_AFTER, ARCHIVE_XL_GAP_AFTER). Both were removed
